plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'at.kochdu.printbridge'
    compileSdk 34

    defaultConfig {
        applicationId "at.kochdu.printbridge"
        minSdk 24
        targetSdk 34
        // Jeder GitHub-Build bekommt eine höhere Nummer – daran erkennt die App, dass es ein Update gibt
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
        versionName "1." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    // Fester Signierschlüssel (GitHub-Secrets KEYSTORE_B64/KEYSTORE_PASSWORD). Android installiert ein Update
    // nur, wenn es mit demselben Schlüssel signiert ist wie die installierte App.
    def ksFile = System.getenv("KEYSTORE_FILE")
    signingConfigs {
        kochdu {
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias "kochdu"
                keyPassword System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            if (ksFile) signingConfig signingConfigs.kochdu
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // erlaubt "Release" ohne eigenen Keystore zum Testen
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Sunmi eingebauter Drucker (offizielles SDK). Falls die Version nicht aufloest,
    // aktuelle Koordinaten auf developer.sunmi.com pruefen.
    implementation 'com.sunmi:printerlibrary:1.0.18'
}
